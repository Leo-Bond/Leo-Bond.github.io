<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="title desc">
  <title id="title">SASRec 与 BERT4Rec 的注意力和训练目标对照</title>
  <desc id="desc">SASRec 用因果注意力逐位置预测下一物品；BERT4Rec 用双向注意力恢复被遮住的历史物品。</desc>
  <style>
    text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #263238; }
    .heading { font-size: 24px; font-weight: 700; }
    .label { font-size: 18px; }
    .small { font-size: 15px; }
    .panel { fill: #f7f9fb; stroke: #d8e2eb; stroke-width: 2; }
    .token { fill: #e8f2ff; stroke: #4585c5; stroke-width: 2; }
    .masked { fill: #fff1db; stroke: #d89529; stroke-width: 2; }
    .edge { stroke: #4585c5; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
    .edgeOrange { stroke: #d89529; stroke-width: 2.5; fill: none; marker-end: url(#arrowOrange); }
  </style>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4585c5"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d89529"/></marker>
  </defs>
  <rect class="panel" x="16" y="18" width="888" height="208" rx="14"/>
  <rect class="panel" x="16" y="252" width="888" height="220" rx="14"/>
  <text class="heading" x="42" y="57">SASRec：因果注意力 → 下一物品</text>
  <text class="heading" x="42" y="293">BERT4Rec：双向注意力 → 被遮物品</text>
  <text class="small" x="42" y="91">位置 t 只能读取 ≤ t 的行为；训练目标是 t+1</text>
  <text class="small" x="42" y="326">[MASK] 可读取左右真实行为；训练目标是原位置物品</text>
  <g class="label" text-anchor="middle">
    <rect class="token" x="70" y="132" width="112" height="56" rx="9"/><text x="126" y="167">相机</text>
    <rect class="token" x="232" y="132" width="112" height="56" rx="9"/><text x="288" y="167">镜头</text>
    <rect class="token" x="394" y="132" width="112" height="56" rx="9"/><text x="450" y="167">存储卡</text>
    <rect class="masked" x="692" y="132" width="150" height="56" rx="9"/><text x="767" y="167">预测：三脚架</text>
    <rect class="token" x="70" y="367" width="112" height="56" rx="9"/><text x="126" y="402">相机</text>
    <rect class="masked" x="232" y="367" width="112" height="56" rx="9"/><text x="288" y="402">[MASK]</text>
    <rect class="token" x="394" y="367" width="112" height="56" rx="9"/><text x="450" y="402">存储卡</text>
    <rect class="masked" x="692" y="367" width="150" height="56" rx="9"/><text x="767" y="402">恢复：镜头</text>
  </g>
  <path class="edge" d="M182 159 H226"/><path class="edge" d="M344 159 H388"/><path class="edge" d="M506 159 H685"/>
  <path class="edgeOrange" d="M182 391 H225"/><path class="edgeOrange" d="M394 391 H350"/><path class="edgeOrange" d="M344 391 H685"/>
  <text class="small" x="536" y="211">未来位置被三角掩码阻断</text>
  <text class="small" x="518" y="448">恢复时同时利用左、右上下文</text>
</svg>
