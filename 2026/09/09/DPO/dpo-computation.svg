<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img"><title>DPO computation from four response log probabilities</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="35" y="45" font-size="27" fill="#0f172a" text-anchor="start">Four sequence scores, one preference loss</text><rect x="380" y="80" width="340" height="65" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="550.0" y="119.5" font-size="19" fill="#0f172a" text-anchor="middle">Prompt + chosen / rejected</text><rect x="80" y="200" width="340" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="250.0" y="237.0" font-size="19" fill="#0f172a" text-anchor="middle">Trainable policy</text><text x="250.0" y="262.0" font-size="19" fill="#0f172a" text-anchor="middle">log p(chosen), log p(rejected)</text><rect x="680" y="200" width="340" height="85" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="850.0" y="237.0" font-size="19" fill="#0f172a" text-anchor="middle">Frozen reference</text><text x="850.0" y="262.0" font-size="19" fill="#0f172a" text-anchor="middle">log q(chosen), log q(rejected)</text><path d="M470,145 L250,200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M630,145 L850,200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="80" y="340" width="340" height="65" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="250.0" y="379.5" font-size="19" fill="#0f172a" text-anchor="middle">Policy gap: log p(w) - log p(l)</text><rect x="680" y="340" width="340" height="65" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="850.0" y="379.5" font-size="19" fill="#0f172a" text-anchor="middle">Reference gap: log q(w) - log q(l)</text><path d="M250,285 L250,340" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M850,285 L850,340" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="300" y="465" width="500" height="65" rx="12" fill="#d1fae5" stroke="#cbd5e1"/><text x="550.0" y="504.5" font-size="19" fill="#0f172a" text-anchor="middle">z = beta * (policy gap - reference gap)</text><path d="M250,405 L400,465" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M850,405 L700,465" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="550" y="567" font-size="20" fill="#0f172a" text-anchor="middle">Loss = -log sigmoid(z)   |   Gradients update the policy only</text></g></svg>