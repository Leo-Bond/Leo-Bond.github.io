<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>PPO-RLHF versus offline DPO</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="35" y="45" font-size="27" fill="#0f172a" text-anchor="start">Preference alignment: two training pipelines</text><text x="35" y="85" font-size="18" fill="#475569" text-anchor="start">Both can start from SFT and preference comparisons.</text><text x="35" y="132" font-size="22" fill="#1d4ed8" text-anchor="start">Typical PPO-RLHF</text><rect x="35" y="155" width="190" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="130.0" y="204.5" font-size="19" fill="#0f172a" text-anchor="middle">Preference pairs</text><rect x="290" y="155" width="220" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="400.0" y="204.5" font-size="19" fill="#0f172a" text-anchor="middle">Train reward model</text><rect x="580" y="155" width="220" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="690.0" y="192.0" font-size="19" fill="#0f172a" text-anchor="middle">Sample responses</text><text x="690.0" y="217.0" font-size="19" fill="#0f172a" text-anchor="middle">from current policy</text><rect x="865" y="155" width="200" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="965.0" y="204.5" font-size="19" fill="#0f172a" text-anchor="middle">Score + advantage</text><path d="M225,197 L290,197" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M510,197 L580,197" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M800,197 L865,197" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="580" y="280" width="220" height="70" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="690.0" y="322.0" font-size="19" fill="#0f172a" text-anchor="middle">PPO update</text><path d="M965,240 L965,315" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M965,315 L800,315" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M690,280 L690,240" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="296" font-size="18" fill="#475569" text-anchor="start">Reference policy: KL baseline</text><text x="35" y="324" font-size="18" fill="#475569" text-anchor="start">Old policy: rollout baseline</text><text x="35" y="401" font-size="22" fill="#047857" text-anchor="start">Standard offline DPO</text><rect x="35" y="425" width="210" height="85" rx="12" fill="#d1fae5" stroke="#cbd5e1"/><text x="140.0" y="474.5" font-size="19" fill="#0f172a" text-anchor="middle">Fixed preference pairs</text><rect x="325" y="425" width="280" height="85" rx="12" fill="#d1fae5" stroke="#cbd5e1"/><text x="465.0" y="462.0" font-size="19" fill="#0f172a" text-anchor="middle">Policy + frozen reference</text><text x="465.0" y="487.0" font-size="19" fill="#0f172a" text-anchor="middle">score both responses</text><rect x="690" y="425" width="190" height="85" rx="12" fill="#d1fae5" stroke="#cbd5e1"/><text x="785.0" y="474.5" font-size="19" fill="#0f172a" text-anchor="middle">DPO loss</text><rect x="935" y="425" width="130" height="85" rx="12" fill="#d1fae5" stroke="#cbd5e1"/><text x="1000.0" y="462.0" font-size="19" fill="#0f172a" text-anchor="middle">Policy</text><text x="1000.0" y="487.0" font-size="19" fill="#0f172a" text-anchor="middle">update</text><path d="M245,467 L325,467" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M605,467 L690,467" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M880,467 L935,467" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="562" font-size="18" fill="#475569" text-anchor="start">No online response sampling or standalone reward-model fitting in the DPO update loop.</text></g></svg>